<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
<title id="title">Choreography: reactions decide the next step</title><desc id="desc">No central workflow owner; the event contracts still define a flow.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#536478"/></marker><marker id="redarr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#af3434"/></marker></defs>
<rect width="960" height="700" rx="20" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .head{font-size:29px;font-weight:700;fill:#15324f}.sub{font-size:19px;fill:#536478}.boxt{font-size:23px;font-weight:700;fill:#15324f}.body{font-size:19px;fill:#33495d}.label{font-size:18px;fill:#536478}.foot{font-size:18px;fill:#536478}</style>
<text x="36" y="49" class="head" text-anchor="start">Choreography: reactions decide the next step</text>
<text x="36" y="82" class="sub" text-anchor="start">No central workflow owner; the event contracts still define a flow.</text>
<rect x="36" y="155" width="264" height="110" rx="13" fill="#edf4ff" stroke="#245b9e" stroke-width="2"/>
<text x="168.0" y="188" class="boxt" text-anchor="middle">Loan</text>
<text x="168.0" y="217" class="body" text-anchor="middle">Offer accepted</text>
<text x="168.0" y="242" class="body" text-anchor="middle">Publishes fact</text>
<rect x="348" y="155" width="264" height="110" rx="13" fill="#e7f7f1" stroke="#137562" stroke-width="2"/>
<text x="480.0" y="188" class="boxt" text-anchor="middle">Capacity</text>
<text x="480.0" y="217" class="body" text-anchor="middle">Reserve R123</text>
<text x="480.0" y="242" class="body" text-anchor="middle">Publish result</text>
<rect x="660" y="155" width="264" height="110" rx="13" fill="#edf4ff" stroke="#245b9e" stroke-width="2"/>
<text x="792.0" y="188" class="boxt" text-anchor="middle">Agreements</text>
<text x="792.0" y="217" class="body" text-anchor="middle">Prepare draft</text>
<text x="792.0" y="242" class="body" text-anchor="middle">Publish result</text>
<polyline points="300,210 348,210" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arr)"/>
<polyline points="612,210 660,210" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="170" y="307" class="body" text-anchor="middle">OfferAccepted</text>
<text x="480" y="307" class="body" text-anchor="middle">CapacityReserved</text>
<rect x="660" y="420" width="264" height="100" rx="13" fill="#fff3df" stroke="#a76012" stroke-width="2"/>
<text x="792.0" y="453" class="boxt" text-anchor="middle">Preparation failed</text>
<text x="792.0" y="482" class="body" text-anchor="middle">Failure fact</text>
<rect x="348" y="420" width="264" height="100" rx="13" fill="#fff0ef" stroke="#af3434" stroke-width="2"/>
<text x="480.0" y="453" class="boxt" text-anchor="middle">Capacity subscriber</text>
<text x="480.0" y="482" class="body" text-anchor="middle">Release R123</text>
<polyline points="792,265 792,420" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="823.7" y="347" width="84.60000000000001" height="25" rx="4" fill="#fff"/>
<text x="866" y="366" class="label" text-anchor="middle">failure</text>
<polyline points="660,470 612,470" fill="none" stroke="#af3434" stroke-width="2.5" marker-end="url(#redarr)"/>
<rect x="603.5" y="531" width="65.0" height="25" rx="4" fill="#fff"/>
<text x="636" y="550" class="label" text-anchor="middle">react</text>
<rect x="36" y="575" width="888" height="67" rx="13" fill="#f1f4f8" stroke="#536478" stroke-width="2"/>
<text x="480.0" y="608" class="boxt" text-anchor="middle"></text>
<text x="58" y="605" class="body" text-anchor="start">A successful preparation could trigger activation through another subscriber.</text>
<text x="58" y="630" class="body" text-anchor="start">Someone must still own deadlines, late events, and stuck-work investigation.</text>
</svg>