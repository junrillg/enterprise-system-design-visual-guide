<text x="480.0" y="408" class="boxt" text-anchor="middle">Failure recovery</text>
<text x="480.0" y="437" class="body" text-anchor="middle">Release reservation</text>
<text x="480.0" y="462" class="body" text-anchor="middle">Retry or manual review</text>
<polyline points="660,430 612,430" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="36" y="375" width="264" height="110" rx="13" fill="#edf4ff" stroke="#245b9e" stroke-width="2"/>
<text x="168.0" y="408" class="boxt" text-anchor="middle">Capacity owner</text>
<text x="168.0" y="437" class="body" text-anchor="middle">Conditional reservation</text>
<text x="168.0" y="462" class="body" text-anchor="middle">Never trust a cached count</text>
