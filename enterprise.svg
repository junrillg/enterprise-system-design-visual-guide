<text x="480.0" y="178" class="boxt" text-anchor="middle">Loan local commit</text>
<text x="480.0" y="207" class="body" text-anchor="middle">Acceptance + outbox</text>
<text x="480.0" y="232" class="body" text-anchor="middle">Atomic request result</text>
<rect x="660" y="145" width="264" height="110" rx="13" fill="#edf4ff" stroke="#245b9e" stroke-width="2"/>
<text x="792.0" y="178" class="boxt" text-anchor="middle">Relay + workflow</text>
<text x="792.0" y="207" class="body" text-anchor="middle">Deduplicate start</text>
<text x="792.0" y="232" class="body" text-anchor="middle">Persist progress</text>
