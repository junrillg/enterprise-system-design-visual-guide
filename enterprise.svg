<text x="792.0" y="408" class="boxt" text-anchor="middle">Activation saga</text>
<text x="792.0" y="437" class="body" text-anchor="middle">Reserve capacity</text>
<text x="792.0" y="462" class="body" text-anchor="middle">Prepare agreement / activate</text>
