<text x="480.0" y="698" class="boxt" text-anchor="middle">History, optional</text>
<text x="480.0" y="727" class="body" text-anchor="middle">Event-sourced Loan</text>
<text x="480.0" y="752" class="body" text-anchor="middle">Rebuild state safely</text>
<rect x="660" y="665" width="264" height="110" rx="13" fill="#edf4ff" stroke="#245b9e" stroke-width="2"/>
<text x="792.0" y="698" class="boxt" text-anchor="middle">Search + reporting</text>
<text x="792.0" y="727" class="body" text-anchor="middle">CDC / committed events</text>
