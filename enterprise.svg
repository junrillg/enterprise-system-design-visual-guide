<rect x="36" y="805" width="888" height="42" rx="13" fill="#f1f4f8" stroke="#536478" stroke-width="2"/>
<text x="480.0" y="838" class="boxt" text-anchor="middle"></text>
<text x="58" y="835" class="body" text-anchor="start">CAP policy: defer authoritative writes when coordination cannot be established.</text>
