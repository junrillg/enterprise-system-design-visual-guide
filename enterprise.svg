<text x="168.0" y="698" class="boxt" text-anchor="middle">Indicative products</text>
<text x="168.0" y="727" class="body" text-anchor="middle">Shared cache</text>
<text x="168.0" y="752" class="body" text-anchor="middle">No binding decisions</text>
