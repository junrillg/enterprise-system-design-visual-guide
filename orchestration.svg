<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">Orchestration: one workflow owns sequence</title><desc id="desc">Participants keep their rules and data; the workflow directs recovery.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#536478"/></marker><marker id="redarr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#af3434"/></marker></defs>
<rect width="960" height="660" rx="20" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .head{font-size:29px;font-weight:700;fill:#15324f}.sub{font-size:19px;fill:#536478}.boxt{font-size:23px;font-weight:700;fill:#15324f}.body{font-size:19px;fill:#33495d}.label{font-size:18px;fill:#536478}.foot{font-size:18px;fill:#536478}</style>
<text x="36" y="49" class="head" text-anchor="start">Orchestration: one workflow owns sequence</text>
<text x="36" y="82" class="sub" text-anchor="start">Participants keep their rules and data; the workflow directs recovery.</text>
<rect x="265" y="140" width="430" height="120" rx="13" fill="#e7f7f1" stroke="#137562" stroke-width="2"/>
<text x="480.0" y="173" class="boxt" text-anchor="middle">Durable activation workflow</text>
<text x="480.0" y="202" class="body" text-anchor="middle">1 Reserve  →  2 Prepare  →  3 Activate</text>
<text x="480.0" y="227" class="body" text-anchor="middle">On failure: coordinate compensation</text>
<rect x="36" y="430" width="264" height="110" rx="13" fill="#edf4ff" stroke="#245b9e" stroke-width="2"/>
<text x="168.0" y="463" class="boxt" text-anchor="middle">Capacity</text>
<text x="168.0" y="492" class="body" text-anchor="middle">Owns reservation rule</text>
<text x="168.0" y="517" class="body" text-anchor="middle">Its own local commit</text>
<rect x="348" y="430" width="264" height="110" rx="13" fill="#edf4ff" stroke="#245b9e" stroke-width="2"/>
<text x="480.0" y="463" class="boxt" text-anchor="middle">Agreements</text>
<text x="480.0" y="492" class="body" text-anchor="middle">Owns draft agreement</text>
<text x="480.0" y="517" class="body" text-anchor="middle">Its own local commit</text>
<rect x="660" y="430" width="264" height="110" rx="13" fill="#edf4ff" stroke="#245b9e" stroke-width="2"/>
<text x="792.0" y="463" class="boxt" text-anchor="middle">Loan</text>
<text x="792.0" y="492" class="body" text-anchor="middle">Owns legal state</text>
<text x="792.0" y="517" class="body" text-anchor="middle">Its own local commit</text>
<polyline points="335,260 335,330 168,330 168,430" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<rect x="85.6" y="348" width="172.8" height="25" rx="4" fill="#fff"/>
<text x="172" y="367" class="label" text-anchor="middle">command / result</text>
<polyline points="480,260 480,430" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<rect x="393.6" y="348" width="172.8" height="25" rx="4" fill="#fff"/>
<text x="480" y="367" class="label" text-anchor="middle">command / result</text>
<polyline points="625,260 625,330 792,330 792,430" fill="none" stroke="#536478" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<rect x="701.6" y="348" width="172.8" height="25" rx="4" fill="#fff"/>
<text x="788" y="367" class="label" text-anchor="middle">command / result</text>
<rect x="36" y="575" width="888" height="67" rx="13" fill="#f1f4f8" stroke="#536478" stroke-width="2"/>
<text x="480.0" y="608" class="boxt" text-anchor="middle"></text>
<text x="58" y="605" class="body" text-anchor="start">Commands and results can travel through durable messages.</text>
<text x="58" y="630" class="body" text-anchor="start">Logical central coordination does not require one unreplicated process.</text>
</svg>