<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
<title id="title">System design concepts</title><desc id="desc">Guarantees, transaction boundaries, and recovery paths.</desc>
